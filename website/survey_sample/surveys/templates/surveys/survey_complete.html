<!DOCTYPE html>
<html>
<head>
    <title>Survey Complete</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; 
               padding: 20px; text-align: center; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; 
                   padding: 20px; border-radius: 5px; margin: 20px 0; }
        .btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; 
               border-radius: 3px; display: inline-block; margin-top: 20px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="success">
        <h1>Thank You!</h1>
        <p>Your response to "{{ survey.title }}" has been recorded.</p>
    </div>
    <a href="{% url 'survey_list' %}" class="btn">Back to Surveys</a>
</body>
</html>
