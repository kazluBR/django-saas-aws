name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: production

    defaults:
      run:
        working-directory: server

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Bootstrap
        run: |
          npx cdk bootstrap -c adminEmail=${{ secrets.ADMIN_EMAIL }}

      - name: CDK Deploy
        run: |
          npx cdk deploy --all --require-approval never -c adminEmail=${{ secrets.ADMIN_EMAIL }}
