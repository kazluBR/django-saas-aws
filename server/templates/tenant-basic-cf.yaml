AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template Basic for Djando App

Parameters:
  TenantName:
    Type: String
  SuperUserEmail:
    Type: String
  SuperUserPassword:
    Type: String
    NoEcho: true

Resources:
  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/django-app-${TenantName}"
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "django-app-task-definition-${TenantName}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue TaskExecutionRoleArn
      TaskRoleArn: !ImportValue AppTaskRoleArn
      ContainerDefinitions:
        - Name: !Sub "django-container-${TenantName}"
          Image: !ImportValue AppEcrRepositoryUri
          Memory: 512
          Cpu: 256
          Essential: true
          PortMappings:
            - ContainerPort: 80
          Command:
            [
              "sh",
              "-c",
              "python manage.py migrate && python manage.py createsuperuser --noinput || true && python manage.py runserver 0.0.0.0:80",
            ]
          Environment:
            - Name: TENANT_NAME
              Value: !Ref TenantName
            - Name: DJANGO_SUPERUSER_USERNAME
              Value: "admin"
            - Name: DJANGO_SUPERUSER_EMAIL
              Value: !Ref SuperUserEmail
            - Name: DJANGO_SUPERUSER_PASSWORD
              Value: !Ref SuperUserPassword
            - Name: TIER
              Value: "basic"
            - Name: DJANGO_SETTINGS_MODULE
              Value: "survey_project.production"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: "django"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "load-balancer-${TenantName}"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !ImportValue AppSecurityGroupId
      Subnets:
        - !ImportValue PublicSubnet1Id
        - !ImportValue PublicSubnet2Id

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "target-group-${TenantName}"
      Port: 80
      Protocol: HTTP
      VpcId: !ImportValue VpcId
      TargetType: ip
      LoadBalancerArns:
        - !Ref LoadBalancer

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "service-${TenantName}"
      Cluster: !ImportValue EcsPoolClusterName
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue PublicSubnet1Id
            - !ImportValue PublicSubnet2Id
          SecurityGroups:
            - !ImportValue AppSecurityGroupId
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: !Sub "django-container-${TenantName}"
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup
Outputs:
  ALBDnsName:
    Description: "DNS Name of the Application Load Balancer"
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "ALBDnsName-${TenantName}"
